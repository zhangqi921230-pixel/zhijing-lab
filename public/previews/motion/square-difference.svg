<svg xmlns="http://www.w3.org/2000/svg" class="motion-diagram observable-scene" viewBox="0 0 900 620" role="img" aria-label="平方差两块面积旋转拼接"><style>text{font:20px Microsoft YaHei,sans-serif;fill:#183d36}.observable-title{font-size:26px;font-weight:700}.observable-number{font-size:28px}</style><rect width="900" height="620" fill="#f4f5ef"/><text x="35" y="44" class="observable-title">同一块面积，两种算法</text><text x="35" y="82">6² − 2² = 32　·　移动和旋转都不改变面积</text><g transform="translate(85 150)"><rect width="228" height="228" fill="none" stroke="#526b63" stroke-dasharray="6 5"></rect><rect x="152" width="76" height="76" fill="none" stroke="#526b63" stroke-dasharray="6 5"></rect><rect y="76" width="228" height="152" fill="#a36d13" fill-opacity=".25" stroke="#a36d13" stroke-width="2"></rect><text x="114" y="159" text-anchor="middle">6 × 4</text><g data-testid="moving-area" transform="translate(330.970583144992 38) rotate(0)"><rect x="-76" y="-38" width="152" height="76" fill="#176b59" fill-opacity=".3" stroke="#176b59" stroke-width="2"></rect><path d="M-70 -32h12v12" fill="none" stroke="#176b59" stroke-width="2"></path><text text-anchor="middle" y="7" transform="rotate(0)">8</text></g><g data-testid="square-dimensions" fill="#183d36"><path d="M-15 76h-10v152h10" fill="none" stroke="#183d36"></path><text transform="translate(-39 152) rotate(-90)" text-anchor="middle">a−b = 4</text><path d="M0 -10v-8h152v8m0 0v-8h76v8" fill="none" stroke="#183d36"></path><text x="76" y="-31" text-anchor="middle" fill="#176b59">a−b = 4</text><text x="190" y="-31" text-anchor="middle">b = 2</text><path d="M0 250v8h228v-8" fill="none" stroke="#183d36"></path><text x="114" y="286" text-anchor="middle">a = 6</text></g></g><text x="710" y="190">面积账本</text><path d="M710 210H875" stroke="#dbe3da"></path><text x="710" y="255" fill="#a36d13">a(a−b) = 24</text><text x="710" y="300" fill="#176b59">b(a−b) = 8</text><text x="710" y="360" class="observable-number">合计 32</text><text x="35" y="565">分离：上方条带平移到外侧。</text><text x="35" y="604">金色与绿色表示两块原有面积；虚线是剪拼前的位置。</text></svg>