<svg xmlns="http://www.w3.org/2000/svg" class="motion-diagram observable-scene comparison-scene" viewBox="0 0 900 620" role="img" aria-label="相似图形的长度与面积同尺度对照"><style>text{font:20px Microsoft YaHei,sans-serif;fill:#183d36}.observable-title{font-size:26px;font-weight:700}.observable-number{font-size:28px}</style><rect width="900" height="620" fill="#f4f5ef"/><defs><pattern id="_R_1_grid" x="100" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#dbe3da"></path></pattern></defs><text x="35" y="44" class="observable-title">长度变为 k 倍，面积变为 k² 倍</text><text x="35" y="80">当前 k = 1.67　·　目标 3.0 倍</text><rect x="60" y="120" width="780" height="280" fill="url(#_R_1_grid)"></rect><text x="100" y="130">原图</text><text x="460" y="130">相似图</text><g><path d="M100 400h120v-80h-120Z" fill="#176b59" fill-opacity=".14" stroke="#176b59" stroke-width="3"></path><text x="160" y="434" text-anchor="middle">3.00 cm</text><text x="230" y="360">2.00</text></g><g><path d="M460 400h199.99999999999997v-133.33333333333331h-199.99999999999997Z" fill="#a36d13" fill-opacity=".14" stroke="#a36d13" stroke-width="3"></path><text x="560" y="434" text-anchor="middle">5.00 cm</text><text x="670" y="333.33333333333337">3.33</text></g><text x="100" y="480">面积 6.00 cm²</text><text x="460" y="480">面积 16.67 cm²</text><text x="100" y="518">周长 10.00 cm</text><text x="460" y="518">周长 16.67 cm</text><text x="35" y="573">每格边长 1 cm；两图采用相同尺度，右侧高度数字单位为 cm。</text></svg>